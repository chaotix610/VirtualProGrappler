<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ring Scene — Babylon.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
    #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    #readout {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font: 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #cfd6e4;
      background: rgba(12,15,22,.82); border: 1px solid rgba(255,255,255,.1);
      padding: 10px 12px; border-radius: 8px; min-width: 250px;
      backdrop-filter: blur(4px); user-select: text;
    }
    #readout .sec { margin-bottom: 9px; }
    #readout .sec:last-child { margin-bottom: 0; }
    #readout b { color: #fff; letter-spacing: .04em; }
    #readout .val { color: #7fd1ff; }
    #readout .obj { color: #cfd6e4; }
    #readout .obj .c { color: #b0f0c0; }
    #readout .obj .s { color: #ffd28a; }
    #readout .hint { color: #79839a; border-top: 1px solid rgba(255,255,255,.08); padding-top: 7px; }
    #readout button {
      font: 10px/1 ui-monospace, monospace; color: #cfe6ff; cursor: pointer;
      background: rgba(127,209,255,.12); border: 1px solid rgba(127,209,255,.35);
      border-radius: 5px; padding: 3px 7px; margin-left: 6px;
    }
    #readout button:hover { background: rgba(127,209,255,.22); }
    #readout button:active { transform: translateY(1px); }
  </style>

  <!-- Babylon core + GLTF/GLB loader (CDN). Swap for your bundled imports in VPG. -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <div id="readout">
    <div class="sec">
      <b>CAMERA</b><button id="copyCam" title="Copy ArcRotateCamera setup line">copy setup</button>
      <div>α (alpha) &nbsp;<span class="val" id="cAlpha">–</span></div>
      <div>β (beta) &nbsp;&nbsp;<span class="val" id="cBeta">–</span></div>
      <div>radius &nbsp;&nbsp;&nbsp;<span class="val" id="cRad">–</span></div>
      <div>target &nbsp;&nbsp;&nbsp;<span class="val" id="cTgt">–</span></div>
      <div>position &nbsp;<span class="val" id="cPos">–</span></div>
    </div>
    <div class="sec">
      <b>OBJECTS</b> <span style="color:#79839a">center · size</span>
      <div id="objList">–</div>
    </div>
    <div class="sec hint">drag orbit · scroll zoom · <b>H</b> hide/show</div>
  </div>
  <canvas id="renderCanvas"></canvas>

  <script>
  // -------------------------------------------------------------------------
  // Where the .glb files live, relative to this HTML file.
  // Serve the folder (e.g. `python3 -m http.server`) — file:// won't load GLBs.
  // -------------------------------------------------------------------------
  const ASSET_PATH = "./";

  // These two GLBs are authored at their final scene transforms, so they
  // import as-is at the origin.
  const STATIC_ASSETS = [
    "ring-standard.glb",
    "ringside-floor-and-barricade.glb",
  ];

  // metal_steps.glb contains ONE step mesh whose authored position matches
  // neither target in the combined layout. We import it once per placement and
  // overwrite the inner node's LOCAL transform with the values taken straight
  // from the combined reference file.
  //
  // Why this works: Babylon's glTF loader wraps every import in an identical
  // "__root__" handedness-conversion node. Because that wrapper is the same for
  // every file, the inner node's local position/rotation equals the raw glTF
  // node values — so dropping in the combined file's node values reproduces its
  // exact world placement. (Verified against the combined GLB.)
  const METAL_STEP_PLACEMENTS = [
    {
      label: "NE",
      position: new BABYLON.Vector3(1.2516371011734009, 0.0, -1.3963381052017212),
      rotationQuaternion: new BABYLON.Quaternion(0.0, -0.7071066498756409, 0.70710688829422, 3.090861255827804e-8),
    },
    {
      label: "SW",
      position: new BABYLON.Vector3(-1.0530617237091064, 0.0, 0.871335506439209),
      rotationQuaternion: new BABYLON.Quaternion(0.70710688829422, 0.0, 0.0, 0.7071066498756409),
    },
  ];

  const INNER_NODE_NAME = "metal-steps-ne"; // node name inside metal_steps.glb

  // ---------------------------------------------------------------------------
  // Arena (entrance stage + audience). It's a ripped N64 model authored in the
  // SAME coordinate space and scale as the ring, so it drops in at the origin
  // with no transform and wraps around the playable area on its own.
  // The transform below is identity by default — nudge it if you ever need to
  // re-fit it to a different ring layout.
  // ---------------------------------------------------------------------------
  const ARENA_FILE = "royal-rumble-arena.glb";
  const ARENA_TRANSFORM = {
    scale: 1.0,
    position: new BABYLON.Vector3(0, 0, 0),
    rotationY: Math.PI, // 180° so the entrance ramp faces south (−Z) side of the ring
  };
  // N64 textures are baked/fullbright; rendering them "unlit" keeps the crowd
  // and entrance tron looking right regardless of scene lighting.
  const ARENA_UNLIT = true;

  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

  async function loadStatic(scene, file) {
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", ASSET_PATH, file, scene);
    res.meshes[0].name = file.replace(/\.glb$/i, ""); // tidy __root__ name
    return res;
  }

  async function placeMetalSteps(scene, placement) {
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", ASSET_PATH, "metal_steps.glb", scene);

    // Find the inner transform node WITHIN this import (don't use a global
    // lookup — both placements share the same node name and would collide).
    const inner =
      res.transformNodes.find((n) => n.name === INNER_NODE_NAME) ||
      res.meshes.find((n) => n.name === INNER_NODE_NAME);

    if (!inner) {
      console.warn("metal-steps inner node not found; nodes:",
        res.transformNodes.map((n) => n.name), res.meshes.map((m) => m.name));
      return res;
    }

    inner.position = placement.position.clone();
    inner.rotationQuaternion = placement.rotationQuaternion.clone();

    // Rename so the two instances are distinguishable in the inspector.
    res.meshes[0].name = "metal-steps-" + placement.label + "-root";
    inner.name = "metal-steps-" + placement.label;
    return res;
  }

  async function loadArena(scene) {
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", ASSET_PATH, ARENA_FILE, scene);

    // Adjustable parent so the whole bowl can be re-fit with one node.
    const arenaRoot = new BABYLON.TransformNode("arena-root", scene);
    arenaRoot.scaling.setAll(ARENA_TRANSFORM.scale);
    arenaRoot.position.copyFrom(ARENA_TRANSFORM.position);
    arenaRoot.rotation.y = ARENA_TRANSFORM.rotationY;
    res.meshes[0].parent = arenaRoot; // res.meshes[0] is the loader's __root__

    // Treat the arena as pure scenery: not pickable, no collisions, and frozen
    // since it never moves (cheaper render for 130+ static meshes).
    for (const m of res.meshes) {
      m.isPickable = false;
      m.checkCollisions = false;
      if (m.getTotalVertices && m.getTotalVertices() > 0) m.freezeWorldMatrix();
    }

    if (ARENA_UNLIT) {
      const seen = new Set();
      for (const m of res.meshes) {
        const mat = m.material;
        if (mat && !seen.has(mat)) {
          seen.add(mat);
          if ("unlit" in mat) mat.unlit = true; // PBRMaterial fullbright
          mat.freeze();
        }
      }
    }
    return res;
  }

  // Union world-space bounding box of a node and all its descendant meshes.
  function groupBounds(node) {
    const meshes = node.getChildMeshes ? node.getChildMeshes(false).slice() : [];
    if (node.getTotalVertices && node.getTotalVertices() > 0) meshes.push(node);
    let min = null, max = null;
    for (const m of meshes) {
      if (!(m.getTotalVertices && m.getTotalVertices() > 0)) continue;
      m.computeWorldMatrix(true);
      const bb = m.getBoundingInfo().boundingBox;
      if (!min) { min = bb.minimumWorld.clone(); max = bb.maximumWorld.clone(); }
      else { min = BABYLON.Vector3.Minimize(min, bb.minimumWorld); max = BABYLON.Vector3.Maximize(max, bb.maximumWorld); }
    }
    if (!min) return null;
    return { center: min.add(max).scale(0.5), size: max.subtract(min), min, max };
  }

  const f = (n, d = 2) => (n >= 0 ? " " : "") + n.toFixed(d);
  const vec = (v, d = 2) => `(${f(v.x, d)},${f(v.y, d)},${f(v.z, d)})`;

  const createScene = async function () {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.043, 0.051, 0.071, 1);

    // Camera — framed to take in the ring and the surrounding bowl.
    const camera = new BABYLON.ArcRotateCamera(
      "camera", -Math.PI / 2, 1.12, 30, new BABYLON.Vector3(0, 2.5, 1), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 6;
    camera.upperRadiusLimit = 90;
    camera.wheelDeltaPercentage = 0.01;
    camera.minZ = 0.1;
    camera.maxZ = 500;

    // Lighting — soft fill + a key light for some form on the metal/posts.
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.85;
    hemi.groundColor = new BABYLON.Color3(0.15, 0.16, 0.2);

    const key = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.5, -1, -0.35), scene);
    key.position = new BABYLON.Vector3(8, 14, 6);
    key.intensity = 1.1;

    // Load the two pre-positioned assets, then both metal-step placements.
    await Promise.all(STATIC_ASSETS.map((f) => loadStatic(scene, f)));
    for (const p of METAL_STEP_PLACEMENTS) {
      await placeMetalSteps(scene, p);
    }

    // Surrounding arena (scenery).
    await loadArena(scene);

    // ---- On-screen readout -------------------------------------------------
    // Static object list (everything is static, so compute centers/sizes once).
    const groups = [
      { label: "Ring",        node: scene.getMeshByName("ring-standard") },
      { label: "Ringside",    node: scene.getMeshByName("ringside-floor-and-barricade") },
      { label: "Steps NE",    node: scene.getMeshByName("metal-steps-NE-root") },
      { label: "Steps SW",    node: scene.getMeshByName("metal-steps-SW-root") },
      { label: "Arena",       node: scene.getTransformNodeByName("arena-root") },
    ];
    const objList = document.getElementById("objList");
    objList.innerHTML = groups.map((g) => {
      const b = g.node && groupBounds(g.node);
      if (!b) return `<div class="obj">${g.label.padEnd(9)} —</div>`;
      return `<div class="obj">${g.label.padEnd(9)}` +
        `<span class="c">${vec(b.center)}</span> · <span class="s">${vec(b.size)}</span></div>`;
    }).join("");

    // Live camera values — read-out updates every frame as you orbit/zoom.
    const cAlpha = document.getElementById("cAlpha");
    const cBeta  = document.getElementById("cBeta");
    const cRad   = document.getElementById("cRad");
    const cTgt   = document.getElementById("cTgt");
    const cPos   = document.getElementById("cPos");
    const deg = (r) => (r * 180 / Math.PI).toFixed(1);

    // Builds a paste-ready constructor line for the current view.
    const cameraSnippet = () =>
      `new BABYLON.ArcRotateCamera("camera", ${camera.alpha.toFixed(4)}, ` +
      `${camera.beta.toFixed(4)}, ${camera.radius.toFixed(2)}, ` +
      `new BABYLON.Vector3(${camera.target.x.toFixed(2)}, ${camera.target.y.toFixed(2)}, ` +
      `${camera.target.z.toFixed(2)}), scene);`;

    scene.onBeforeRenderObservable.add(() => {
      cAlpha.textContent = `${camera.alpha.toFixed(4)} rad  (${deg(camera.alpha)}°)`;
      cBeta.textContent  = `${camera.beta.toFixed(4)} rad  (${deg(camera.beta)}°)`;
      cRad.textContent   = camera.radius.toFixed(2);
      cTgt.textContent   = vec(camera.target);
      cPos.textContent   = vec(camera.position);
    });

    const copyBtn = document.getElementById("copyCam");
    copyBtn.addEventListener("click", async () => {
      const line = cameraSnippet();
      try {
        await navigator.clipboard.writeText(line);
        copyBtn.textContent = "copied!";
      } catch {
        console.log(line); // clipboard blocked (e.g. non-secure context) — logged instead
        copyBtn.textContent = "see console";
      }
      setTimeout(() => (copyBtn.textContent = "copy setup"), 1200);
    });

    // H toggles the panel so it never blocks the view you're framing.
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        const r = document.getElementById("readout");
        r.style.display = r.style.display === "none" ? "" : "none";
      }
    });

    return scene;
  };

  createScene().then((scene) => {
    engine.runRenderLoop(() => scene.render());
  }).catch((err) => {
    console.error("Scene failed to load:", err);
    document.getElementById("readout").innerHTML =
      "Load error — see console. Are the .glb files served alongside this page?";
  });

  window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
