<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Virtual Pro Grappler</title>
  <style>
    @font-face {
      font-family: "VPG XFiles";
      src: url("/assets/textures/ui/fonts/xfiles.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Oswald";
      src: url("/assets/textures/ui/fonts/Oswald-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* Body weight, for menu copy that is not a menu item. */
    @font-face {
      font-family: "Oswald";
      src: url("/assets/textures/ui/fonts/Oswald-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --vpg-frame-color: #ffffff;
      --vpg-frame-width: 1px;
      --vpg-panel-bg: rgba(54, 45, 187, 0.35);
      --vpg-heading-bg: rgba(54, 45, 187, 0.48);
      --vpg-panel-glow: #add8e6;
      --vpg-modal-bg: #1a0d4a;
      --vpg-modal-border: #b8e0f0;
      --vpg-modal-backdrop: rgba(0, 0, 0, 0.45);
      --vpg-font-display: "VPG XFiles", Impact, Arial Black, sans-serif;
      --vpg-font-body: Oswald, Arial, sans-serif;
      --vpg-font-menu-item: Oswald, sans-serif;
      --vpg-item-size: clamp(26px, 2.65vw, 34px);
      --vpg-item-color-idle: #ffffff;
      --vpg-item-color-active: #f28f3d;
      --vpg-item-color-disabled: #888888;
      --vpg-item-stroke: #000000;
      --vpg-state-transition: 0.2s ease;
      --vpg-page-transition: 0.25s ease-out;
      --vpg-modal-transition: 0.18s ease-out;
      background: #050507;
      font-family: var(--vpg-font-body);
    }

    /*
      Glow on the highlighted menu item. Defined here rather than in a
      component because both the main menu and the control mapper use it, and
      Vue rewrites keyframe names inside scoped styles.

      The stroke and fill are handled by transitions on the item itself; this
      only pulses the halo, so the item still reads clearly at the dim end of
      the cycle.
    */
    @keyframes glowPulse {
      0%, 100% {
        text-shadow:
          -15px 0 8px rgba(0, 248, 37, 0.5),
          15px 0 8px rgba(0, 248, 37, 0.5),
          25px 0 8px rgba(0, 248, 37, 0.5),
          -25px 0 8px rgba(0, 248, 37, 0.5);
      }

      50% {
        text-shadow:
          -35px 0 25px rgba(0, 248, 37, 1),
          35px 0 25px rgba(0, 248, 37, 1),
          45px 0 25px rgba(0, 248, 37, 1),
          -45px 0 25px rgba(0, 248, 37, 1),
          0 0 30px rgba(0, 248, 37, 0.8);
      }
    }

    /* A menu that pulses indefinitely is exactly what this setting is for. */
    @media (prefers-reduced-motion: reduce) {
      @keyframes glowPulse {
        0%, 100% {
          text-shadow:
            0 0 8px rgba(242, 143, 61, 0.6),
            0 0 18px rgba(242, 143, 61, 0.3);
        }
      }
    }

  </style>
  </head>
  <body>
    <noscript>
      <strong>Virtual Pro Grappler requires JavaScript to be enabled.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
